/*
 * Refer to the named.conf(5) and named(8) man pages, and the documentation
 * in /usr/share/doc/bind-* for more details.
 */

acl "xfer" {
	none;
};

acl "trusted" {
	127.0.0.0/8;
	192.168.0.0/24;
	192.168.10.0/24;
	10.128.0.0/14;
	172.30.0.0/16;
	::1/128;
};

options {
	directory "/var/bind";
	pid-file "/run/named/named.pid";

	listen-on-v6 { ::1; };
	listen-on { 127.0.0.1; 192.168.0.103; };

	allow-query {
		trusted;
	};

	allow-query-cache {
		trusted;
	};

	allow-recursion {
		trusted;
	};

	allow-transfer {
		none;
	};

	allow-update {
		none;
	};

	forward first;
	forwarders {
		77.91.63.250;
		1.1.1.1;
		8.8.8.8;
	};

	dnssec-validation no;
};

/*
