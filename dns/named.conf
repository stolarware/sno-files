	channel default_log {
		file "/var/log/named/named.log" versions 5 size 50M;
		print-time yes;
		print-severity yes;
		print-category yes;
	};

	category default { default_log; };
	category general { default_log; };
};
*/

include "/etc/bind/rndc.key";

controls {
	inet 127.0.0.1 port 953
		allow { 127.0.0.1/32; ::1/128; }
		keys { "rndc-key"; };
};

zone "." IN {
	type hint;
	file "/var/bind/named.cache";
};

zone "localhost" IN {
	type master;
	file "pri/localhost.zone";
	notify no;
};

//
// Główna domena
//
zone "stolarek.org.pl" {
	type master;
	file "/var/bind/pri/stolarek.org.pl.local.zone";
	allow-query { any; };
	allow-transfer { none; };
};

//
// OpenShift SNO #1
//
zone "sno.stolarek.org.pl" {
	type master;
	file "/var/bind/pri/sno.stolarek.org.pl.local.zone";
	allow-query { any; };
	allow-transfer { none; };
};

//
// OpenShift SNO #2
//
zone "sno2.stolarek.org.pl" {
	type master;
	file "/var/bind/pri/sno2.stolarek.org.pl.local.zone";
	allow-query { any; };
	allow-transfer { none; };
};

//
// Reverse DNS for ordinanry addresses
//
zone "0.168.192.in-addr.arpa" IN {
	type master;
	file "/var/bind/pri/stolarek.org.pl.reverse.zone";
};
//
// Reverse DNS for IMM Remote management modules of rack servers
//
zone "10.168.192.in-addr.arpa" {
    type master;
    file "/var/bind/pri/stolarek.imm.org.pl.reverse.zone";
};
